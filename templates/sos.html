<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dc2626">
  <title>Send SOS · EmergencySOS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
<header class="bar">
  <div class="logo"><span class="cross" aria-hidden="true"></span><b>EmergencySOS</b></div>
  <div class="bar-right">
    <button type="button" class="lang" id="langBtn" lang="hi" aria-label="Language / भाषा">हिन्दी</button>
    <div class="who" id="who"><a href="/login">Log in</a></div>
  </div>
</header>

<main>
  <!-- ========== STEP 1: SEND ========== -->
  <section id="sendView">
    <p class="call-note" data-i18n-html="callNote">Life in danger right now? Also call <a href="tel:112"><b>112</b></a> (ambulance 108).</p>

    <form id="sosForm" novalidate>
      <fieldset>
        <legend data-i18n="step1">1. What happened?</legend>
        <div class="types" id="types" role="radiogroup" aria-label="Emergency type"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="step2">2. How serious is it?</legend>
        <div class="sev" id="sev" role="radiogroup" aria-label="Severity"></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="step3">3. Where is the patient?</legend>
        <button type="button" class="btn outline wide" id="geoBtn" data-i18n="geo">&#9737; Use my current location</button>
        <select id="preset" aria-label="Or choose a place"></select>
        <div id="pickMap" class="pick-map" aria-label="Tap the map to set the location"></div>
        <p class="hint" id="locText">Tap the map to move the pin.</p>
        <input type="hidden" name="latitude" id="lat">
        <input type="hidden" name="longitude" id="lon">
      </fieldset>

      <fieldset>
        <legend data-i18n="step4">4. Patient</legend>
        <label><span data-i18n="name">Patient name</span> <input name="patient_name" id="pname" maxlength="80" autocomplete="name" required></label>
        <label><span data-i18n="phone">Phone to call back</span> <input name="phone" id="pphone" type="tel" maxlength="20" autocomplete="tel"></label>
        <label><span data-i18n="desc">What happened? (optional)</span> <input name="description" maxlength="255"></label>
      </fieldset>

      <p class="error" id="formError" role="alert"></p>
      <button type="submit" class="btn sos" id="sendBtn" data-i18n="send">SEND SOS</button>
    </form>

    <section id="myRequests" class="card hidden">
      <h2 data-i18n="mine">My requests</h2>
      <div id="myList"></div>
    </section>
  </section>

  <!-- ========== STEP 2: TRACK ========== -->
  <section id="trackView" class="hidden" aria-live="polite">
    <div class="card status" id="statusCard"></div>
    <div class="alert-bar" id="alertBar">
      <button type="button" class="alert-toggle" id="alertBtn" aria-pressed="true"></button>
      <button type="button" class="alert-test" id="testAlertBtn" data-i18n="testAlert">Test</button>
    </div>
    <div id="trackMap" class="track-map hidden"></div>
    <div class="card" id="detailCard"></div>
    <button class="btn outline wide" id="newBtn" data-i18n="another">Send another SOS</button>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='offline_map.js') }}"></script>
<script src="{{ url_for('static', filename='portal_i18n.js') }}"></script>
<script src="{{ url_for('static', filename='portal.js') }}"></script>
</body>
</html>
